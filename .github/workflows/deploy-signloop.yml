name: Deploy SignLoop to GitHub Pages

on:
  push:
    # TODO: drop the feature branch below once this workflow has run once
    # from master - it's here only so the very first deploy doesn't have to
    # wait for a merge (workflow_dispatch can't target a workflow that has
    # never existed on the default branch yet).
    branches: [master, claude/asl-learning-gesture-recognition-6efoug]
    paths:
      - 'asl-learning-platform/**'
      - '.github/workflows/deploy-signloop.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asl-learning-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: asl-learning-platform/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          GH_PAGES_BASE: /${{ github.event.repository.name }}/

      # GitHub Pages has no server-side SPA fallback: a direct visit to e.g.
      # /practice would 404. Serving the same index.html as the 404 page lets
      # the client-side router take over and render the right route.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: asl-learning-platform/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
