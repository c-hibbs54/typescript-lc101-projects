<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/handshape.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn American Sign Language fingerspelling with real-time webcam hand-shape feedback, powered entirely in your browser."
    />
    <!--
      Keep this out of search indexes and AI training corpora.

      This meta tag, NOT robots.txt, is what does the work on a GitHub Pages
      *project* site. robots.txt is only ever read from the domain root
      (https://c-hibbs54.github.io/robots.txt), which belongs to a separate
      c-hibbs54.github.io repository; a robots.txt shipped from here is served
      at /typescript-lc101-projects/robots.txt and no crawler will consult it.
      public/robots.txt exists anyway so the site is already correct the day it
      moves to a custom domain or a user page.

      All of this is advisory. It is honoured by the search engines and by the
      AI crawlers that identify themselves; it stops nobody who doesn't want to
      be stopped. The only real privacy control is not publishing the site.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <title>SignJutsu — Learn ASL with your webcam</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
